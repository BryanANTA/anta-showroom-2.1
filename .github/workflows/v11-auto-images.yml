name: ANTA V11 Auto Image Updater

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Products to process"
        required: true
        default: "10"
        type: string

permissions:
  contents: write

jobs:
  update-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ANTA image updater
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: python v11_image_updater.py --limit "$LIMIT"

      - name: Commit updated catalogue
        run: |
          git config user.name "anta-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add products.json
          if [ -f review_queue_v11.csv ]; then git add review_queue_v11.csv; fi
          git commit -m "V11 update product images" || exit 0
          git push
