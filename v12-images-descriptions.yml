name: ANTA V12 Images + Descriptions Enricher

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Products to process"
        required: true
        default: "5"
        type: string
      skus:
        description: "Optional comma-separated SKUs"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  enrich-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run V12 enrichment
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          SKUS: ${{ github.event.inputs.skus }}
        run: |
          ARGS=""
          if [ -n "$SKUS" ]; then
            IFS=',' read -ra ITEMS <<< "$SKUS"
            for s in "${ITEMS[@]}"; do ARGS="$ARGS --sku $(echo "$s" | xargs)"; done
          fi
          python v12_enrichment_updater.py --limit "$LIMIT" $ARGS
      - name: Commit enrichment results
        run: |
          git config user.name "anta-enrichment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add products.json v12_last_run.json
          git commit -m "V12 enrich images and descriptions" || exit 0
          git push
